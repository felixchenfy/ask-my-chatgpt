name: Bug report
description: Report a reproducible problem with sanitized evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please omit secrets, real conversation URLs, private prompts and signed-in page captures. For vulnerabilities, follow SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Chrome, coding client and repository commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example and state which tool was called.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the sanitized error/status and whether delivery is confirmed, unsent or uncertain.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks already performed
      description: Separate offline tests, connection checks and live exchanges. Do not resend to diagnose an uncertain delivery.
