[project]
name = "web-content-agent"
version = "0.1.0"
description = "MCP bridge from coding agents to signed-in ChatGPT, with local-first web collection"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "httpx>=0.28.1",
  "lxml>=5.4.0",
  "lmstudio>=1.5.0",
  "markdownify>=1.1.0",
  "pillow>=11.2.1",
  "playwright>=1.52.0",
  "pydantic>=2.11.4",
  "pyyaml>=6.0.2",
  "tenacity>=9.1.2",
  "trafilatura>=2.0.0",
  "typer>=0.15.3",
  "mcp>=1.13,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-httpx>=0.35.0",
  "ruff>=0.11.8",
]

[project.scripts]
wca = "web_content_agent.cli:app"
wca-mcp = "web_content_agent.mcp.server:main"
wca-onepoint3acres-app = "web_content_agent.onepoint3acres_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_content_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "lmstudio: requires the localhost LM Studio server and loaded model",
  "live: accesses a configured public website",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["runtime", "tmp", ".venv", "work", "output", "outputs", ".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
